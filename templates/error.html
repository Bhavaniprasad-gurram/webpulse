{% extends "base.html" %}
{% block title %}Error {{ code }} — WebPulse{% endblock %}
{% block page_title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center error-wrap">
  <div class="text-center">
    <div class="empty-icon lg mb-3"><i class="bi {% if code == 404 %}bi-compass{% else %}bi-exclamation-octagon{% endif %}"></i></div>
    <h2 class="fw-bold mb-2 error-code">{{ code }}</h2>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="bi bi-arrow-left me-1"></i>Back to dashboard</a>
  </div>
</div>
{% endblock %}
